<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - CineMax</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap');
    body { background-color: #070a12; color: #ffffff; font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- PASSWORD SCREEN (ONLY ON /admin.html) -->
  <div id="lockScreen" class="fixed inset-0 z-50 bg-[#070a12] flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-[#0f1626] border border-white/10 rounded-2xl p-6 text-center shadow-2xl">
      <div class="w-14 h-14 rounded-2xl bg-red-600/20 border border-red-500/30 flex items-center justify-center mx-auto mb-4">
        <i class="fa-solid fa-user-shield text-red-500 text-2xl"></i>
      </div>
      <h1 class="text-xl font-extrabold mb-1">Admin Panel Lock</h1>
      <p class="text-xs text-gray-400 mb-5">Enter secret password to upload movies</p>

      <form onsubmit="verifyAdmin(event)" class="space-y-3">
        <input id="passInput" type="password" placeholder="Enter Password..." required
          class="w-full bg-black/50 border border-white/15 rounded-xl px-4 py-3 text-sm text-center focus:outline-none focus:border-red-500">
        <p id="passError" class="text-xs text-red-500 hidden">Galat Password!</p>
        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-sm shadow-lg shadow-red-600/30 transition">
          Login Admin
        </button>
      </form>
    </div>
  </div>

  <!-- ADMIN UPLOADER DASHBOARD -->
  <div id="adminDashboard" class="hidden flex-1 flex flex-col">
    <header class="bg-[#0f1626] border-b border-white/10 px-4 sm:px-8 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <i class="fa-solid fa-gauge-high text-red-500 text-xl"></i>
        <span class="font-extrabold text-base sm:text-lg">CINEMAX <span class="text-red-500">ADMIN</span></span>
      </div>
      <div class="flex items-center gap-2">
        <a href="index.html" class="bg-white/10 hover:bg-white/15 text-xs font-semibold px-3.5 py-2 rounded-xl flex items-center gap-1.5 transition">
          <i class="fa-solid fa-globe"></i> Open Main Website
        </a>
        <button onclick="logoutAdmin()" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white text-xs font-bold px-3 py-2 rounded-xl transition">
          <i class="fa-solid fa-power-off"></i>
        </button>
      </div>
    </header>

    <main class="max-w-4xl mx-auto w-full p-4 sm:p-6 grid grid-cols-1 md:grid-cols-12 gap-6">
      <div class="md:col-span-7 bg-[#0f1626] border border-white/10 rounded-2xl p-5 shadow-xl h-fit">
        <h2 class="text-base font-bold mb-4 flex items-center gap-2 border-b border-white/10 pb-3">
          <i class="fa-solid fa-cloud-arrow-up text-red-500"></i> Upload Movie (Up to 1.5GB)
        </h2>

        <div class="space-y-4">
          <div>
            <label class="text-xs text-gray-400 block mb-1">1. Movie Title *</label>
            <input id="movieTitle" type="text" oninput="checkReady()" placeholder="Ex: Animal (Full HD Hindi)" 
              class="w-full bg-black/40 border border-white/10 rounded-xl px-3.5 py-2.5 text-sm focus:border-red-500 focus:outline-none">
          </div>

          <div>
            <label class="text-xs text-gray-400 block mb-1">2. Category</label>
            <select id="movieCategory" class="w-full bg-[#090d16] border border-white/10 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none">
              <option value="South Hindi">South Hindi</option>
              <option value="Bollywood">Bollywood</option>
              <option value="Hollywood">Hollywood</option>
              <option value="Animation">Animation</option>
            </select>
          </div>

          <div class="bg-black/40 p-3.5 rounded-xl border border-white/10">
            <label class="text-xs text-gray-300 font-semibold block mb-2">3. Movie Thumbnail (Poster) *</label>
            <input id="thumbInput" type="file" accept="image/*" onchange="uploadThumbnail(this.files[0])"
              class="text-xs text-gray-300 w-full file:mr-3 file:py-2 file:px-3.5 file:rounded-lg file:border-0 file:bg-white/10 file:text-white file:font-semibold cursor-pointer">
            
            <div id="thumbProgressWrap" class="hidden mt-3">
              <div class="flex justify-between text-xs mb-1">
                <span id="thumbStatus" class="text-yellow-400">Uploading Poster...</span>
                <span id="thumbPct" class="font-bold">0%</span>
              </div>
              <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
                <div id="thumbBar" class="bg-green-500 h-full w-0 transition-all"></div>
              </div>
            </div>
          </div>

          <div class="bg-black/40 p-3.5 rounded-xl border border-white/10">
            <label class="text-xs text-gray-300 font-semibold block mb-2">4. Movie Video File (MP4/MKV up to 1.5GB) *</label>
            <input id="videoInput" type="file" accept="video/mp4,video/x-matroska,video/*" onchange="uploadLargeMovie(this.files[0])"
              class="text-xs text-gray-300 w-full file:mr-3 file:py-2 file:px-3.5 file:rounded-lg file:border-0 file:bg-red-600 file:text-white file:font-semibold cursor-pointer">

            <div id="videoProgressWrap" class="hidden mt-3">
              <div class="flex justify-between text-xs mb-1">
                <span id="videoStatus" class="text-yellow-400 font-medium">Uploading Movie... Page band na karein!</span>
                <span id="videoPct" class="font-bold text-red-400">0%</span>
              </div>
              <div class="w-full bg-gray-800 h-3 rounded-full overflow-hidden">
                <div id="videoBar" class="bg-gradient-to-r from-red-600 to-orange-500 h-full w-0 transition-all"></div>
              </div>
              <p id="mbCounter" class="text-[11px] text-gray-400 mt-1.5 text-right font-mono">0 MB / 0 MB</p>
            </div>
          </div>

          <button id="publishBtn" onclick="saveMovieToWebsite()" disabled
            class="w-full py-3.5 rounded-xl font-bold text-sm bg-gray-800 text-gray-500 cursor-not-allowed transition">
            Wait for 100% Upload Complete...
          </button>
        </div>
      </div>

      <div class="md:col-span-5 bg-[#0f1626] border border-white/10 rounded-2xl p-5 shadow-xl h-fit">
        <div class="flex items-center justify-between border-b border-white/10 pb-3 mb-4">
          <h2 class="text-base font-bold flex items-center gap-2">
            <i class="fa-solid fa-film text-red-500"></i> Manage Movies
          </h2>
          <span id="totalBadge" class="bg-red-600 text-xs font-extrabold px-2.5 py-0.5 rounded-full">0</span>
        </div>
        <div id="adminList" class="space-y-2.5 max-h-[420px] overflow-y-auto pr-1"></div>
      </div>
    </main>
  </div>

  <script>
    const ADMIN_PASSWORD = "amanboss";

    const SUPABASE_URL = "https://usfbydecsqlirmlipboh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_5Soi8PsOJOyfiPfD3Reemg_h3-PFqjQ";

    const IMGBB_API_KEY = "324dcad1f46a93c5dbaa896ca36f51ba";
    const ARCHIVE_ACCESS_KEY = "Pb3yC6BVZs3GVbRI";
    const ARCHIVE_SECRET_KEY = "m3ck67AqvoLiFxx0";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let finalThumbUrl = "";
    let finalVideoUrl = "";

    window.onload = () => {
      if (sessionStorage.getItem("cinemax_admin_auth") === "true") {
        unlockDashboard();
      }
    };

    function verifyAdmin(e) {
      e.preventDefault();
      const input = document.getElementById('passInput').value;
      if (input === ADMIN_PASSWORD) {
        sessionStorage.setItem("cinemax_admin_auth", "true");
        unlockDashboard();
      } else {
        document.getElementById('passError').classList.remove('hidden');
      }
    }

    function unlockDashboard() {
      document.getElementById('lockScreen').classList.add('hidden');
      document.getElementById('adminDashboard').classList.remove('hidden');
      loadAdminMovies();
    }

    function logoutAdmin() {
      sessionStorage.removeItem("cinemax_admin_auth");
      location.reload();
    }

    function uploadThumbnail(file) {
      if (!file) return;
      finalThumbUrl = "";
      checkReady();

      const wrap = document.getElementById('thumbProgressWrap');
      const bar = document.getElementById('thumbBar');
      const pct = document.getElementById('thumbPct');
      const status = document.getElementById('thumbStatus');
      wrap.classList.remove('hidden');
      bar.style.width = "0%";
      pct.innerText = "0%";
      status.innerText = "Uploading Poster...";
      status.className = "text-yellow-400";

      const formData = new FormData();
      formData.append("image", file);

      const xhr = new XMLHttpRequest();
      xhr.open("POST", `https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, true);

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const p = Math.round((e.loaded / e.total) * 100);
          bar.style.width = p + "%";
          pct.innerText = p + "%";
        }
      };

      xhr.onload = () => {
        if (xhr.status === 200) {
          const res = JSON.parse(xhr.responseText);
          finalThumbUrl = res.data.display_url;
          status.innerText = "✔ Poster 100% Uploaded!";
          status.className = "text-green-400 font-bold";
          checkReady();
        } else {
          status.innerText = "Poster Upload Failed!";
          status.className = "text-red-500";
        }
      };

      xhr.send(formData);
    }

    function uploadLargeMovie(file) {
      if (!file) return;
      finalVideoUrl = "";
      checkReady();

      const wrap = document.getElementById('videoProgressWrap');
      const bar = document.getElementById('videoBar');
      const pct = document.getElementById('videoPct');
      const status = document.getElementById('videoStatus');
      const mbCounter = document.getElementById('mbCounter');
      wrap.classList.remove('hidden');
      bar.style.width = "0%";
      pct.innerText = "0%";
      status.innerText = "Uploading Movie... Page band na karein!";
      status.className = "text-yellow-400 font-medium";

      const bucketName = "cinemax_hd_" + Date.now();
      const cleanFileName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const uploadUrl = `https://s3.us.archive.org/${bucketName}/${cleanFileName}`;

      const xhr = new XMLHttpRequest();
      xhr.open("PUT", uploadUrl, true);
      xhr.setRequestHeader("Authorization", `LOW ${ARCHIVE_ACCESS_KEY}:${ARCHIVE_SECRET_KEY}`);
      xhr.setRequestHeader("x-archive-auto-make-bucket", "1");
      xhr.setRequestHeader("x-archive-meta-mediatype", "movies");
      xhr.setRequestHeader("x-archive-meta-collection", "opensource_movies");
      xhr.setRequestHeader("Content-Type", file.type || "video/mp4");

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const p = Math.round((e.loaded / e.total) * 100);
          const loadedMB = (e.loaded / (1024 * 1024)).toFixed(1);
          const totalMB = (e.total / (1024 * 1024)).toFixed(1);
          bar.style.width = p + "%";
          pct.innerText = p + "%";
          mbCounter.innerText = `${loadedMB} MB / ${totalMB} MB uploaded`;
        }
      };

      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          finalVideoUrl = `https://s3.us.archive.org/${bucketName}/${cleanFileName}`;
          status.innerText = "✔ 100% Movie Uploaded Successfully!";
          status.className = "text-green-400 font-bold";
          checkReady();
        } else {
          status.innerText = "Upload Error (" + xhr.status + "). Dobara try karein.";
          status.className = "text-red-500";
        }
      };

      xhr.onerror = () => {
        status.innerText = "Network Disconnected!";
        status.className = "text-red-500";
      };

      xhr.send(file);
    }

    function checkReady() {
      const title = document.getElementById('movieTitle').value.trim();
      const btn = document.getElementById('publishBtn');

      if (title && finalThumbUrl && finalVideoUrl) {
        btn.disabled = false;
        btn.className = "w-full py-3.5 rounded-xl font-bold text-sm bg-red-600 hover:bg-red-700 text-white cursor-pointer shadow-lg shadow-red-600/30 transition";
        btn.innerText = "🚀 Publish Movie to Website Now";
      } else {
        btn.disabled = true;
        btn.className = "w-full py-3.5 rounded-xl font-bold text-sm bg-gray-800 text-gray-500 cursor-not-allowed transition";
        btn.innerText = "Pehle Title, Poster aur Movie 100% Upload Karein";
      }
    }

    async function saveMovieToWebsite() {
      const btn = document.getElementById('publishBtn');
      btn.disabled = true;
      btn.innerText = "Publishing Movie...";

      const title = document.getElementById('movieTitle').value.trim();
      const category = document.getElementById('movieCategory').value;

      const { error } = await db
        .from('movies')
        .insert([{ title, category, thumbnail_url: finalThumbUrl, video_url: finalVideoUrl }]);

      if (error) {
        alert("Supabase Error: " + error.message);
        checkReady();
      } else {
        alert("🎉 Movie Website Par Live Ho Gayi Hai!");
        document.getElementById('movieTitle').value = "";
        document.getElementById('thumbInput').value = "";
        document.getElementById('videoInput').value = "";
        finalThumbUrl = "";
        finalVideoUrl = "";
        document.getElementById('thumbProgressWrap').classList.add('hidden');
        document.getElementById('videoProgressWrap').classList.add('hidden');
        checkReady();
        loadAdminMovies();
      }
    }

    async function loadAdminMovies() {
      const { data, error } = await db
        .from('movies')
        .select('*')
        .order('created_at', { ascending: false });

      const container = document.getElementById('adminList');
      if (error) {
        container.innerHTML = `<p class="text-xs text-red-400">Error: ${error.message}</p>`;
        return;
      }

      const list = data || [];
      document.getElementById('totalBadge').innerText = list.length;

      if (list.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-500 text-center py-8">Abhi koi movie upload nahi hui hai.</p>`;
        return;
      }

      container.innerHTML = list.map(m => `
        <div class="flex items-center justify-between bg-black/40 p-2.5 rounded-xl border border-white/10">
          <div class="flex items-center gap-3 overflow-hidden pr-2">
            <img src="${m.thumbnail_url}" class="w-10 h-14 object-cover rounded-lg flex-shrink-0 bg-gray-900">
            <div class="truncate">
              <h4 class="text-xs font-bold text-white truncate">${m.title}</h4>
              <span class="text-[10px] text-red-400 font-semibold">${m.category}</span>
            </div>
          </div>
          <button onclick="deleteMovie(${m.id})" class="w-8 h-8 rounded-lg bg-red-600/15 hover:bg-red-600 text-red-500 hover:text-white flex items-center justify-center flex-shrink-0 transition">
            <i class="fa-solid fa-trash text-xs"></i>
          </button>
        </div>
      `).join('');
    }

    async function deleteMovie(id) {
      if (!confirm("Delete this movie?")) return;
      await db.from('movies').delete().eq('id', id);
      loadAdminMovies();
    }
  </script>
</body>
</html>
